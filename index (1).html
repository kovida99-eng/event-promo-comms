<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Promo Kit Generator</title>
<style>
  :root {
    --bg: #f3f1ec; --card: #ffffff; --ink: #1f2420; --muted: #5d655f;
    --line: #d9d6cb; --accent: #a8431c; --accent-ink: #ffffff; --panel: #f7e9e1; --bad: #a3231a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2421; --ink: #ecefe9; --muted: #a6aea7;
      --line: #38403b; --accent: #ff9a6c; --accent-ink: #2a1307; --panel: #33251e; --bad: #ff948a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-weight: 600; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  input, select, textarea {
    width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  textarea { resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 11px 22px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .count { font-size: 0.85rem; color: var(--muted); }
  .count.over { color: var(--bad); font-weight: 600; }
  pre {
    white-space: pre-wrap; word-wrap: break-word; margin: 0; padding: 12px; font: inherit;
    background: var(--panel); border-radius: 6px;
  }
  #msg { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Event promo kit generator</h1>
  <p class="sub">Fill in your event details and get draft posts, an email blurb, and hashtags for each platform. These are first drafts, so always edit before publishing.</p>

  <form class="card" id="form" autocomplete="off" novalidate>
    <div class="grid">
      <div class="full"><label for="name">Event name <span class="hint">(required)</span></label>
        <input id="name" type="text" placeholder="Materials Innovation Day"></div>
      <div><label for="date">Date <span class="hint">(required)</span></label>
        <input id="date" type="date"></div>
      <div><label for="time">Start time <span class="hint">(optional)</span></label>
        <input id="time" type="time"></div>
      <div class="full"><label for="venue">Venue <span class="hint">(required, or "Online")</span></label>
        <input id="venue" type="text" placeholder="The Royal Society, London"></div>
      <div class="full"><label for="about">What is it about? <span class="hint">(one short sentence, optional)</span></label>
        <input id="about" type="text" placeholder="a day of talks on sustainable materials and recycling"></div>
      <div><label for="link">Registration link <span class="hint">(optional)</span></label>
        <input id="link" type="text" placeholder="https://example.org/register"></div>
      <div><label for="tone">Tone</label>
        <select id="tone"><option value="friendly">Friendly</option><option value="professional">Professional</option><option value="excited">Excited</option></select></div>
      <div class="full"><label for="tags">Your own topic hashtags <span class="hint">(optional, separated by commas)</span></label>
        <input id="tags" type="text" placeholder="materials, engineering, sustainability"></div>
    </div>
    <p id="msg" role="alert"></p>
    <button class="main" type="submit">Generate promo kit</button>
  </form>

  <div id="results"></div>
</main>

<script>
  const $ = id => document.getElementById(id);

  const camel = s => s.replace(/[^a-zA-Z0-9\s]/g, "").split(/\s+/).filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1)).join("");

  function formatDate(value) {
    const d = new Date(value + "T12:00:00");
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  function formatTime(value) {
    if (!value) return "";
    const [h, m] = value.split(":").map(Number);
    return (h % 12 || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? "am" : "pm");
  }

  function hashtags(d) {
    const own = d.tags.split(",").map(t => camel(t)).filter(Boolean).map(t => "#" + t);
    const event = d.eventTag ? ["#" + d.eventTag] : [];
    const uniq = arr => [...new Set(arr)];
    return {
      LinkedIn: uniq([...event, ...own]).slice(0, 4),
      X: uniq([...event, ...own]).slice(0, 2),
      Instagram: uniq([...event, ...own, "#Events", "#Networking"]).slice(0, 10),
      Facebook: uniq([...event, ...own]).slice(0, 3)
    };
  }

  const openers = {
    friendly: "We'd love to see you at",
    professional: "We are pleased to invite you to",
    excited: "Big news! Join us at"
  };
  const closers = {
    friendly: "Hope to see you there!",
    professional: "We look forward to welcoming you.",
    excited: "Don't miss out, we can't wait to see you there!"
  };

  function build(d) {
    const when = [d.dateText, d.timeText && "at " + d.timeText].filter(Boolean).join(" ");
    const where = d.venue;
    const about = d.about ? d.about.replace(/\.$/, "") : "";
    const open = openers[d.tone], close = closers[d.tone];
    const tags = hashtags(d);
    const join = (...parts) => parts.filter(Boolean).join("\n\n");
    const reg = d.link ? "Register here: " + d.link : "";
    const detail = "📅 " + when + "\n📍 " + where;

    const posts = {
      LinkedIn: join(open + " " + d.name + ".", about && "This is " + about + ".", detail, reg, close, tags.LinkedIn.join(" ")),
      X: [open + " " + d.name + " 📅 " + (d.dateText || "") + " 📍 " + where, d.link, tags.X.join(" ")].filter(Boolean).join("\n"),
      Instagram: join(open + " " + d.name + "! ✨", about && "Expect " + about + ".", detail, d.link ? "Link in bio to register." : "", close, tags.Instagram.join(" ")),
      Facebook: join(open + " " + d.name + ".", about && "Expect " + about + ".", detail, reg, close, tags.Facebook.join(" "))
    };

    const email = "Subject: " + (d.tone === "excited" ? "You're invited: " : "Join us: ") + d.name + (d.dateText ? " | " + d.dateText : "") +
      "\n\nHello,\n\n" + open + " " + d.name + ", taking place on " + when + " at " + where + "." +
      (about ? "\n\nThis is " + about + "." : "") +
      (d.link ? "\n\nTo secure your place, register here: " + d.link : "") +
      "\n\n" + close + "\n\nBest wishes,\n[Your name]";

    return { posts, email, tags };
  }

  const XLINK = 23; // X counts every link as 23 characters
  function xLength(text, link) {
    return link ? text.replace(link, "").length + XLINK : text.length;
  }

  function render(kit, link) {
    const box = $("results");
    box.innerHTML = "";
    const add = (title, text, limitNote) => {
      const card = document.createElement("section");
      card.className = "card";
      const head = document.createElement("div");
      head.className = "head";
      const h = document.createElement("h2");
      h.textContent = title;
      const side = document.createElement("div");
      const info = document.createElement("span");
      info.className = "count";
      if (limitNote) info.textContent = limitNote.text, info.classList.toggle("over", limitNote.over);
      const btn = document.createElement("button");
      btn.type = "button"; btn.textContent = "Copy";
      btn.style.marginLeft = "10px";
      btn.onclick = async () => {
        try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
        catch (e) { btn.textContent = "Select and copy"; }
        setTimeout(() => (btn.textContent = "Copy"), 1500);
      };
      side.append(info, btn);
      head.append(h, side);
      const pre = document.createElement("pre");
      pre.textContent = text;
      card.append(head, pre);
      box.append(card);
    };

    for (const [platform, text] of Object.entries(kit.posts)) {
      let note = { text: text.length + " characters", over: false };
      if (platform === "X") {
        const n = xLength(text, link);
        note = { text: n + " / 280 characters" + (n > 280 ? " (too long, shorten it)" : ""), over: n > 280 };
      }
      add(platform + " post", text, note);
    }
    add("Email", kit.email, null);
    const tagText = Object.entries(kit.tags).map(([p, t]) => p + ": " + t.join(" ")).join("\n");
    add("Hashtags by platform", tagText, null);
    box.scrollIntoView({ behavior: "smooth" });
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const msg = $("msg");
    msg.textContent = "";
    const d = {
      name: $("name").value.trim(), venue: $("venue").value.trim(), about: $("about").value.trim(),
      link: $("link").value.trim(), tone: $("tone").value, tags: $("tags").value,
      dateText: $("date").value ? formatDate($("date").value) : "", timeText: formatTime($("time").value)
    };
    if (!d.name || !d.venue || !d.dateText) {
      msg.textContent = "Please fill in the event name, date, and venue.";
      return;
    }
    d.eventTag = camel(d.name);
    render(build(d), d.link);
  });
</script>
</body>
</html>
